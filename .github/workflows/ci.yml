name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10 = Ubuntu 22.04, 3.11 = Debian 12, 3.12 = Ubuntu 24.04,
        # 3.14 = what production runs. README promises 3.10+.
        python-version: ['3.10', '3.11', '3.12', '3.14']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Syntax check
        run: |
          python -m py_compile app.py database.py wireguard.py alerts.py \
                                notifications.py cache_ext.py google_auth.py envflags.py routes/*.py

      - name: Run pytest
        run: pytest -q

      - name: Smoke test app factory
        env:
          SECRET_KEY: ci-secret-key-not-for-prod-xxxxxxxxxxxxxxxxxxxx
          WG_ENDPOINT: ci.example
          DATABASE_PATH: /tmp/ci-smoke.db
        run: |
          python -c "from app import create_app; \
            app = create_app(); \
            c = app.test_client(); \
            r = c.get('/'); \
            assert r.status_code == 302, r.status_code; \
            print('factory smoke OK')"
