<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>{{ code }} — {{ title }}</title>
  {#- Standalone on purpose: rendered for ANONYMOUS visitors (see
      app.py _error_page). Must not extend base.html or use any value from
      the inject_globals context processor — no app data on this page. -#}
  <style>
    :root { color-scheme: dark; }
    html, body { margin: 0; height: 100%; }
    body {
      display: flex; align-items: center; justify-content: center;
      background: #0d111b; color: #e2e8f0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      text-align: center; padding: 0 16px;
    }
    .code { font-size: 3rem; font-weight: 700; opacity: 0.3; }
    .msg  { margin: 8px 0 24px; color: #8892a4; }
    a     { color: #60a5fa; text-decoration: none; }
    a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <main>
    <div class="code">{{ code }}</div>
    <div class="msg">{{ message }}</div>
    <a href="/">Home</a>
  </main>
</body>
</html>
