# Traverse — nginx reverse proxy (HTTP).
# install.sh substitutes __DOMAIN__. If you run certbot afterwards
# (`certbot --nginx -d <domain>`) it upgrades this to HTTPS automatically and
# adds the 80->443 redirect. The `location /static/` block MUST come before
# `location /`.
server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript
               image/svg+xml application/manifest+json;

    # Let's Encrypt HTTP-01 challenge
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # __PIHOLE_BEGIN__ (install.sh keeps this block only when Pi-hole is set up)
    # Pi-hole's admin UI, behind the Traverse login. FTL listens on
    # 127.0.0.1:8088 with webserver.paths.prefix=/pihole, so it emits /pihole/…
    # URLs; the trailing slash on proxy_pass strips the prefix again.
    location = /_internal/auth-check {
        internal;
        proxy_pass http://127.0.0.1:5000;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
    }
    location = /pihole  { return 302 /pihole/admin/; }
    location = /pihole/ { return 302 /pihole/admin/; }
    location /pihole/ {
        auth_request /_internal/auth-check;
        error_page 401 = @login_redirect;
        proxy_pass         http://127.0.0.1:8088/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_buffering off;
        proxy_redirect off;
    }
    location @login_redirect {
        return 302 /login?next=$request_uri;
    }
    # __PIHOLE_END__

    location /static/ {
        proxy_pass         http://127.0.0.1:5000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        expires 7d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location / {
        proxy_pass         http://127.0.0.1:5000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
        proxy_buffering off;
    }
}
